spring.application.name=Respaldos

# Base de la aplicacion: Oracle XE en el contenedor oracle-xe (puerto 1522 del host).
# El 1521 del host es otra Oracle local: no se usa.
# Las credenciales no van en el repositorio: se leen de variables de entorno o del
# archivo .env de la raiz (no versionado; plantilla en .env.example). Las variables de
# entorno tienen prioridad sobre .env. Sin RESPALDOS_DB_CLAVE la app no arranca.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${RESPALDOS_DB_URL:jdbc:oracle:thin:@//localhost:1522/XEPDB1}
spring.datasource.username=${RESPALDOS_DB_USUARIO:respaldos}
spring.datasource.password=${RESPALDOS_DB_CLAVE}

# El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Ambiente donde corre RMAN. La app solo ejecuta comandos en los contenedores
# de esta lista (regla 1: probar solo en oracle-xe, nunca en la Oracle local).
respaldos.docker.ejecutable=docker
respaldos.docker.contenedores-permitidos=oracle-xe
respaldos.docker.tiempo-maximo-rman=2h
respaldos.docker.tiempo-maximo-comando=30s

# Programador propio de la aplicacion: cada "intervalo" revisa que estrategias tienen
# una ejecucion pendiente. Si una ejecucion se paso por mas de "tolerancia" (p. ej. la
# app estaba apagada), no se ejecuta tarde: se registra como omitida.
respaldos.programador.habilitado=true
respaldos.programador.intervalo=60s
respaldos.programador.tolerancia=30m

# Monitor preventivo: cada "intervalo" revisa las condiciones de riesgo y abre o cierra alertas.
respaldos.monitor.intervalo=15m
respaldos.monitor.retraso-inicial=1m
